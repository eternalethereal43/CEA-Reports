name: Build report manifest

# Rebuilds manifest.json whenever a report is added or removed, so the
# dashboard picks it up without any manual step.

on:
  push:
    paths:
      - '*.xlsx'
      - '*.xls'
      - '*.xlsm'
      - 'tools/make_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build manifest
        run: python3 tools/make_manifest.py

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "manifest already up to date"
          else
            git commit -m "Update report manifest [skip ci]"
            git push
          fi
